# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Use version 2 configuration format
version = 2
# Check all dependencies for unmaintained crates
unmaintained = "all"
# Ignore specific advisories (add IDs here if needed)
ignore = [
    # proc-macro-error - unmaintained but only used at build time
    "RUSTSEC-2024-0370", # proc-macro-error

    # ttf-parser - unmaintained (status: unmaintained, not an active vulnerability).
    # Since slint 1.18 it is reachable only on Linux: ttf-parser 0.25.1 <- owned_ttf_parser
    # <- ab_glyph <- sctk-adwaita (Wayland window decorations) <- winit <-
    # i-slint-backend-winit. `cargo tree -i ttf-parser --target x86_64-pc-windows-msvc`
    # reports "nothing to print", so the shipped target never builds it; cargo-deny reports
    # on Cargo.lock without target awareness, so the ignore stays. The advisory's suggested
    # replacement is `skrifa`, which sctk-adwaita would have to adopt first. ttf-parser has
    # no CVE-class vulnerability today, so the immediate security risk is nil.
    "RUSTSEC-2026-0192", # ttf-parser: crate is unmaintained by upstream (harfbuzz/ttf-parser#217)

    # zvariant, zvariant_derive and zbus_names - unmaintained (merged into zbus 6, no
    # vulnerability). Reachable only on Linux: zbus 5 <- accesskit_unix / atspi <-
    # i-slint-backend-winit, and ksni; `cargo tree -i zvariant --target x86_64-pc-windows-msvc`
    # prints nothing. Drop these once slint's accessibility stack moves to zbus 6
    # (z-galaxy/zbus#2043).
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
] # end of advisories.ignore

[licenses]
# Use version 2 configuration format
version = 2
# Allow AGPL-3.0 (our project license) and common permissive licenses
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    # Public-domain dedication (OSI approved, FSF Free/Libre) - strictly more
    # permissive than MIT/BSD above and compatible with AGPL-3.0. Reached via
    # ksni (Linux StatusNotifierItem tray backend behind Slint 1.17's new
    # SystemTrayIcon element); `cargo tree -i ksni --target x86_64-pc-windows-msvc`
    # reports "nothing to print", so it is not in the shipped Windows build.
    "Unlicense",
    "Zlib",
    # Slint custom licenses
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8
# Allow exceptions for specific crates (if needed)
exceptions = []

[bans]
# Warn about multiple versions of the same crate
multiple-versions = "warn"
# Deny specific crates (add here if needed)
deny = []
# Skip certain crates from duplicate version checking
skip = []
# Skip checking for duplicates in tree
skip-tree = []

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
# Deny crates from git sources (prefer crates.io)
unknown-git = "deny"
# Allow crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow specific git sources if needed
allow-git = []
