# SPDX-License-Identifier: AGPL-3.0-only
# Copy as .github/workflows/ci.yml; adapt commands, directories and runners to the repo.
# Give each repo its own weekly minute. Every added PR job belongs in ci-ok. No paths: filter:
# a skipped workflow leaves the required checks pending.
name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "38 4 * * 0" }]   # weekly audit + main revalidation; minute unique per repo
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      # Git for Windows checks out CRLF by default; the line-ending hooks expect the committed LF bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Some runner VMs start without HKCU\...\CurrentVersion\Run, which every Windows profile
      # normally has; the autostart tests (via the cargo-test hook) open it rather than create it.
      - run: reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /f
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with: { extra-args: "--all-files --hook-stage manual" }
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions: { contents: read }
    env: { RUST_BACKTRACE: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Sequential: the Windows APIs under test share global state.
      # The old CI's list: cpu_profiling_test and dhat_profiling_test are profiling runs, and
      # uwp_process_detection_tests needs a UWP app (Calculator) installed, which the runner lacks.
      - run: cargo test --locked --release --test integration_tests --test version_detection_tests --test memory_usage_test --test startup_time_test --test cpu_usage_test --test icon_cache_tests -- --test-threads=1
      - run: cargo test --locked --release --doc
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: ./scripts/smoke-windows.ps1
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked cargo-deny
      # --workspace: without it cargo-deny roots the graph at easyhdr alone and skips fuzz/.
      # Advisories run off-PR (audit job): a new RustSec advisory must not turn unrelated PRs red.
      - run: cargo deny --locked --workspace check bans licenses sources
      # On Linux, Slint's font stack (yeslogic-fontconfig-sys) probes fontconfig through pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml
  ci-ok:
    if: always()
    needs: [checks, tests, smoke, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
        run: |
          jq -e --arg skips "$ALLOWED_SKIPS" '
            ($skips | split(",") | map(select(. != ""))) as $allowed
            | length > 0 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and (.key | IN($allowed[]))))
          ' <<<"$NEEDS" >/dev/null || { echo "::error::ci-ok failed: $(jq -c 'map_values(.result)' <<<"$NEEDS")"; exit 1; }
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked cargo-deny
      - run: cargo deny --locked --workspace check advisories
