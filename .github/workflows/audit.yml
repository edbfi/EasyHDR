# SPDX-License-Identifier: AGPL-3.0-only
# Nightly RustSec audit: advisories change without a
# commit, so the workspace lockfile is checked every night. --workspace roots the graph
# at every member, so the fuzz crate's dependencies are covered as well.
# ci.yml's deny job runs the full cargo-deny check on PRs and pushes.
name: Audit
on:
  schedule: [{ cron: "23 3 * * *" }]
  workflow_dispatch:
permissions: {}
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked cargo-deny
      - run: cargo deny --locked --workspace check advisories
