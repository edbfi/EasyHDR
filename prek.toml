# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.2"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit", "manual"]

# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

# Local hooks — project-specific quality gates
[[repos]]
repo = "local"
hooks = [
  # Commit-stage: formatting check
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all -- --check", language = "system", pass_filenames = false, files = "(\\.rs$|^Cargo\\.toml$|^(rustfmt|rust-toolchain)\\.toml$)" },

  # Commit-stage: clippy. On Windows host run native; on other hosts (dev convenience) fall back to cargo-xwin against the MSVC target.
  { id = "cargo-clippy", name = "cargo clippy", entry = "bash -c 'if [ \"$OS\" = \"Windows_NT\" ]; then cargo clippy --locked --all-targets --all-features -- -D warnings; else cargo xwin clippy --locked --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings; fi'", language = "system", pass_filenames = false, files = "(\\.rs$|^Cargo\\.(toml|lock)$|^rust-toolchain\\.toml$|^ui/.*\\.slint$|^assets/.*\\.ico$)" },

  # Push-stage: library tests on Windows; check-only on non-Windows hosts.
  { id = "cargo-test", name = "cargo test", entry = "bash -c 'if [ \"$OS\" = \"Windows_NT\" ]; then cargo test --locked --lib; else cargo xwin check --locked --lib --target x86_64-pc-windows-msvc; fi'", language = "system", pass_filenames = false, stages = ["pre-push"] },
]
